# Gipfel und Jöcher mit Bedeutung (hoch/mittel/niedrig) wie bei bergfex – für die Beschriftung der Karte (v1994).
# Ergebnis im Repo-Ordner gipfel/ (wird mit der App ausgeliefert). Läuft mit dem Kartenablauf 4 x pro Jahr und von Hand.
# Dazu Felswände, Grate und Geröll (v1995) als Vektorkacheln karte/fels/<Stand>.pmtiles in R2 (Weg /karte/fels/z/x/y.pbf).
name: Gipfel

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 3 3,6,9,12 *"

permissions:
  contents: write

env:
  BUCKET: qfeaktivfotos
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ENDPOINT: https://fbcade196ec6ad17a597c7ae5d75b31b.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"

concurrency:
  group: gipfel
  cancel-in-progress: false

jobs:
  gipfel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool rclone tippecanoe > /dev/null
          pip install -q osmium numpy
      - name: OSM-Daten holen und Gipfel/Jöcher herausfiltern
        run: |
          mkdir -p /tmp/g && cd /tmp/g
          for x in austria switzerland liechtenstein italy/nord-est italy/nord-ovest germany/bayern germany/baden-wuerttemberg slovenia; do
            n=$(echo $x | tr '/' '-')
            curl -sSfL --retry 3 -o "$n.pbf" "https://download.geofabrik.de/europe/$x-latest.osm.pbf"
            osmium tags-filter "$n.pbf" n/natural=peak,volcano,saddle,hill n/mountain_pass=yes -o "g-$n.pbf" --overwrite
            osmium tags-filter "$n.pbf" w/natural=cliff,ridge,arete,scree -o "f-$n.pbf" --overwrite
            rm -f "$n.pbf"
          done
          osmium merge g-*.pbf -o gipfel.pbf --overwrite
          osmium merge f-*.pbf -o fels.pbf --overwrite
          ls -la gipfel.pbf fels.pbf
      - name: Bedeutung berechnen
        run: |
          rm -rf gipfel && python3 karte/gipfel.py /tmp/g/gipfel.pbf gipfel
          du -sh gipfel; ls gipfel | wc -l
      - name: Felswände und Grate als Vektorkacheln
        run: |
          cd /tmp/g
          osmium export fels.pbf -f geojsonseq -o fels.geojsonseq --overwrite --geometry-types=linestring,polygon \
            -x print_record_separator=false
          # Geröll nur als Fläche, Felswände/Grate als Linie (geschlossene Felswände = Linie rundherum)
          python3 - <<'PY'
          import json
          with open("fels.geojsonseq") as f, open("fels2.geojsonseq", "w") as o:
              for l in f:
                  g = json.loads(l); t = (g.get("properties") or {}).get("natural")
                  typ = g["geometry"]["type"]
                  if t == "scree":
                      if typ not in ("Polygon", "MultiPolygon"): continue
                  elif t in ("cliff", "ridge", "arete"):
                      if typ in ("Polygon", "MultiPolygon"):
                          ring = g["geometry"]["coordinates"][0] if typ == "Polygon" else g["geometry"]["coordinates"][0][0]
                          g["geometry"] = {"type": "LineString", "coordinates": ring}
                  else: continue
                  o.write(json.dumps({"type": "Feature", "geometry": g["geometry"], "properties": {"t": t}}) + "\n")
          PY
          tippecanoe -o fels.pmtiles -l fels -Z11 -z14 -r1 --no-feature-limit --no-tile-size-limit --force fels2.geojsonseq
          ls -la fels.pmtiles
          STAND=$(date +%F-%H%M)
          rclone copyto fels.pmtiles "r2:$BUCKET/karte/fels/$STAND.pmtiles" --s3-chunk-size 64M --s3-upload-concurrency 8 || rclone copyto fels.pmtiles "r2:$BUCKET/karte/fels/$STAND.pmtiles" --s3-chunk-size 64M --s3-upload-concurrency 8
          echo "{\"pfad\":\"karte/fels/$STAND.pmtiles\",\"stand\":\"$STAND\"}" > fels-aktuell.json
          rclone copyto fels-aktuell.json "r2:$BUCKET/karte/fels/aktuell.json" || rclone copyto fels-aktuell.json "r2:$BUCKET/karte/fels/aktuell.json"
          cat fels-aktuell.json
      - name: Ins Repo
        run: |
          git config user.name "gipfelbuch-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A gipfel
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git commit -q -m "Gipfel: Bedeutung neu berechnet ($(date +%F))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
