# Fertige Reliefbilder wie bergfex (Stufe 3, v1996): karte/relief.py rechnet aus den AWS Terrain Tiles
# durchsichtige Schattenbilder (WebP) für Zoom 12–15, packt sie in eine PMTiles-Datei und legt sie in R2 ab
# (karte/relief/<Stand>.pmtiles + karte/relief/aktuell.json). Der Worker liefert sie unter /karte/relief/z/x/y.webp.
# Gebiet (Eingabe gebiet): Rechtecke w,s,e,n;… – Standard Vorarlberg, Tirol, Salzburg, Südtirol, Liechtenstein.
name: Relief

on:
  workflow_dispatch:
    inputs:
      gebiet:
        description: "Rechtecke w,s,e,n;w,s,e,n"
        default: "9.45,46.35,13.4,47.75"
      zooms:
        description: "Zoomstufen"
        default: "12,13,14,15"

permissions:
  contents: read

env:
  BUCKET: qfeaktivfotos
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ENDPOINT: https://fbcade196ec6ad17a597c7ae5d75b31b.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"

concurrency:
  group: relief
  cancel-in-progress: false

jobs:
  relief:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone > /dev/null
          pip install -q numpy pillow pmtiles
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /
      - name: Reliefbilder rechnen
        run: python3 karte/relief.py /tmp/relief "${{ github.event.inputs.zooms || '12,13,14,15' }}" "${{ github.event.inputs.gebiet || '9.45,46.35,13.4,47.75' }}"
      - name: Packen und hochladen
        run: |
          python3 karte/relief.py --pmtiles /tmp/relief /tmp/relief.pmtiles
          ls -la /tmp/relief.pmtiles
          STAND=$(date +%F-%H%M)
          for i in 1 2 3; do rclone copyto /tmp/relief.pmtiles "r2:$BUCKET/karte/relief/$STAND.pmtiles" --s3-chunk-size 64M --s3-upload-concurrency 8 && break; sleep 5; done
          echo "{\"pfad\":\"karte/relief/$STAND.pmtiles\",\"stand\":\"$STAND\",\"gebiet\":\"${{ github.event.inputs.gebiet || '9.45,46.35,13.4,47.75' }}\"}" > aktuell.json
          for i in 1 2 3; do rclone copyto aktuell.json "r2:$BUCKET/karte/relief/aktuell.json" && break; sleep 5; done
          cat aktuell.json
          echo "## Relief $STAND" >> $GITHUB_STEP_SUMMARY; ls -la /tmp/relief.pmtiles >> $GITHUB_STEP_SUMMARY
