# Gipfelbuch – eigene Wanderkarte erzeugen und auf den eigenen Kartenserver (Cloudflare R2) laden.
# Läuft automatisch 4 x pro Jahr (3. März, Juni, September, Dezember) und kann jederzeit von Hand gestartet werden
# (GitHub → Actions → „Karte aktualisieren“ → Run workflow). Braucht keine Claude-Nutzung.
#
# Einmalig nötig (macht Marcel, Claude gibt keine Schlüssel ein):
#   Cloudflare → R2 → „API-Token verwalten“ → Token mit „Objekt Lesen & Schreiben“ nur für den Speicher qfeaktivfotos anlegen.
#   GitHub → Projekt gipfelbuch → Settings → Secrets and variables → Actions → zwei Secrets anlegen:
#     R2_ACCESS_KEY_ID  und  R2_SECRET_ACCESS_KEY  (Werte aus dem Cloudflare-Token)
#
# Ablauf: OSM-Daten Österreich + Südtirol holen → Grundkarte (PMTiles) + Wege-Zellen erzeugen → mit der letzten Version vergleichen
# (verschwinden in einer Region über 2 % der Wege: NICHT freischalten) → hochladen → freischalten (karte/aktuell.json)
# → kurzer Test über den Worker; schlägt er fehl, wird die alte Version wieder eingesetzt. Alte Versionen bleiben im Speicher.
name: Karte aktualisieren

on:
  schedule:
    - cron: "17 2 3 3,6,9,12 *"
  workflow_dispatch:
    inputs:
      hoehen:
        description: "Höhenmodell, Hangneigung und Höhenlinien (neu) berechnen (beim ersten Mal ja)"
        type: boolean
        default: false
      trotzdem:
        description: "Auch freischalten, wenn der Vergleich auffällig ist (nur nach Prüfung!)"
        type: boolean
        default: false

concurrency: karte

permissions:
  contents: write

env:
  GEBIETE: "Österreich,Südtirol"
  BUCKET: qfeaktivfotos
  WORKER: https://gipfelbuch.quer-feld-ein.workers.dev
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ENDPOINT: https://fbcade196ec6ad17a597c7ae5d75b31b.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
  PLANETILER: "0.9.1"

jobs:
  karte:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Zugang prüfen
        run: |
          if [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ] || [ -z "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::Secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY fehlen (siehe Kopf dieser Datei)."; exit 1; fi

      - name: Platz schaffen und Werkzeuge installieren
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool rclone tippecanoe > /dev/null
          pip install -q osmium shapely pmtiles numpy pillow
          df -h . | tail -1

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Version festlegen
        run: |
          mkdir -p w && cd w
          # Zugang zum Speicher prüfen (falsche Schlüssel fallen hier sofort auf)
          rclone lsf "r2:$BUCKET/karte/" --max-depth 1 > /dev/null || { echo "::error::Kein Zugriff auf R2 – Schlüssel in den Secrets prüfen"; exit 1; }
          # bisherige Version (beim ersten Lauf gibt es noch keine)
          rclone copyto "r2:$BUCKET/karte/aktuell.json" alt-aktuell.json 2>/dev/null || true
          [ -s alt-aktuell.json ] || echo '{}' > alt-aktuell.json
          python3 -c "import json;a=json.load(open('alt-aktuell.json'));print(a.get('basis',''))" > alt-basis.txt
          # Versionsname = Datum; läuft es am selben Tag nochmal, kommt die Uhrzeit dazu (die laufende Version bleibt unangetastet)
          V=$(date -u +%Y-%m-%d)
          if grep -q "\"version\":\"$V" alt-aktuell.json; then V="$V-$(date -u +%H%M)"; fi
          echo "V=$V" >> $GITHUB_ENV; echo "Neue Version: $V"
          if [ -s alt-basis.txt ] && [ "$(cat alt-basis.txt)" != "" ]; then rclone copyto "r2:$BUCKET/$(cat alt-basis.txt)zellen/index.json" alt-index.json || true; fi
          # Höhendaten beim ersten Lauf oder auf Wunsch berechnen
          if [ "${{ inputs.hoehen }}" = "true" ] || ! grep -q '"hang"' alt-aktuell.json; then echo "HOEHEN_RECHNEN=1" >> $GITHUB_ENV; fi

      - name: OSM-Daten holen (Österreich, Südtirol, Randstreifen der Nachbarländer)
        working-directory: w
        run: |
          curl -sSfL -o at.pbf  https://download.geofabrik.de/europe/austria-latest.osm.pbf
          curl -sSfL -o at.poly https://download.geofabrik.de/europe/austria.poly
          curl -sSfL -o ne.pbf  https://download.geofabrik.de/europe/italy/nord-est-latest.osm.pbf
          osmium tags-filter ne.pbf r/boundary=administrative -o adm.pbf --overwrite
          python3 ../karte/gebiet.py admin adm.pbf "ISO3166-2=IT-BZ" 6 suedtirol.geojson
          python3 ../karte/gebiet.py poly at.poly at.geojson
          osmium extract -p suedtirol.geojson ne.pbf -o st.pbf --overwrite
          osmium merge at.pbf st.pbf -o gebiet.pbf --overwrite
          python3 ../karte/gebiet.py abdeckung abdeckung.json at.geojson suedtirol.geojson
          # Grenzen für das Inventar (Bundesland, Bezirk)
          osmium tags-filter at.pbf r/admin_level=4,6,8 -o g-AT.pbf --overwrite
          osmium tags-filter adm.pbf r/ISO3166-2=IT-BZ -o g-IT.pbf --overwrite
          # Randstreifen: Zellen an der Grenze sollen vollständig sein (Wege auf der anderen Seite gehören dazu).
          # Nachbarländer: alles im Streifen von 0,6° um das Gebiet; für die 1°-Zellen (Täler, Gebirge, Naturparks)
          # nur diese Merkmale im ganzen 1°-Rechteck.
          python3 ../karte/gebiet.py rand rand.geojson 0.6 at.geojson suedtirol.geojson
          RING=$(python3 ../karte/gebiet.py ring at.geojson suedtirol.geojson); echo "1°-Rechteck: $RING"
          nachbar() {
            n=$1; [ -s "$n.pbf" ] || curl -sSfL --retry 3 -o "$n.pbf" "https://download.geofabrik.de/europe/$2-latest.osm.pbf"
            osmium extract -p rand.geojson "$n.pbf" -o "rand-$n.pbf" --overwrite
            osmium tags-filter "$n.pbf" nwr/natural=valley r/region:type=mountain_area nwr/protection_title nwr/boundary=national_park -o "t-$n.pbf" --overwrite
            osmium extract -b "$RING" "t-$n.pbf" -o "ring-$n.pbf" --overwrite
            rm -f "$n.pbf" "t-$n.pbf"; echo "$n fertig"
          }
          # Nordost-Italien ist schon da (Trentino, Venetien, Friaul)
          nachbar ne italy/nord-est
          for x in "ch switzerland" "li liechtenstein" "by germany/bayern" "bw germany/baden-wuerttemberg" "cz czech-republic" \
                   "sk slovakia" "hu hungary" "si slovenia" "nw italy/nord-ovest"; do
            set -- $x; curl -sSfL --retry 3 -o "$1.pbf" "https://download.geofabrik.de/europe/$2-latest.osm.pbf" &
            while [ "$(jobs -r | wc -l)" -ge 3 ]; do sleep 2; done
          done; wait
          for x in "ch switzerland" "li liechtenstein" "by germany/bayern" "bw germany/baden-wuerttemberg" "cz czech-republic" \
                   "sk slovakia" "hu hungary" "si slovenia" "nw italy/nord-ovest"; do set -- $x; nachbar $1 $2; done
          osmium merge gebiet.pbf rand-*.pbf ring-*.pbf -o zellen.pbf --overwrite
          rm -f adm.pbf rand-*.pbf ring-*.pbf
          ls -la

      - name: Wege-Zellen erzeugen (Hütten, Wege, Parkplätze, Sperren …)
        working-directory: w
        run: |
          python3 ../karte/zellen.py zellen.pbf zellen --version "$V"
          rm -f zellen.pbf
          cp zellen/index.json zellen-index.json

      - name: Wege als Vektorkacheln (wie bergfex/komoot)
        working-directory: w
        run: |
          node ../karte/wegekarte.mjs ../index.html zellen wege
          tippecanoe -o wege-niedrig.pmtiles -l w -Z10 -z12 -r1 --no-feature-limit --no-tile-size-limit --force -q wege-niedrig.geojsonl
          tippecanoe -o wege-hoch.pmtiles -l w -Z12 -z14 -r1 --no-feature-limit --no-tile-size-limit --force -q wege-hoch.geojsonl
          tile-join -o wege.pmtiles --no-tile-size-limit --force -q wege-niedrig.pmtiles wege-hoch.pmtiles 2>&1 | grep -v mismatched || true
          rm -f wege-*.geojsonl wege-niedrig.pmtiles wege-hoch.pmtiles
          # Zellen verschlanken: Wege kommen jetzt aus den Vektorkacheln, von „sac“ bleiben nur Klettersteige (Datenblatt)
          python3 ../karte/zellen_schlank.py zellen
          echo "Speicherbedarf:"; du -sh wege.pmtiles; du -sh zellen/* | sort -h | tail -8; du -sh zellen

      - name: Inventar (Wege, Hütten, Parkplätze, Bergbahnen, Klettersteige mit Merkmalen)
        working-directory: w
        run: |
          rm -f gem.json
          for K in AT IT; do python3 ../karte/parkplaetze.py grenzen "g-$K.pbf" gem.json; done
          python3 ../karte/inventar.py erzeugen gebiet.pbf gem.json inventar.tsv.gz
          # Parkplätze wie in der App ausgewählt (für die Tabelle gb_parkplaetze)
          osmium tags-filter gebiet.pbf nwr/amenity=parking -o p.pbf --overwrite
          rm -f inv.jsonl; for K in AT IT; do python3 ../karte/parkplaetze.py inventar gem.json inv.jsonl $K p.pbf; done
          python3 ../karte/parkplaetze.py zusammen inv.jsonl park-neu.json
          # Inventar der bisherigen Version (gibt es ab dem ersten Lauf mit diesem Skript bzw. nach „Karte prüfen“ mit basis)
          ALT=$(python3 -c "import json;a=json.load(open('alt-aktuell.json'));print(a.get('basis',''))")
          [ -n "$ALT" ] && rclone copyto "r2:$BUCKET/${ALT}inventar.tsv.gz" alt-inventar.tsv.gz 2>/dev/null || true

      - name: Mit der letzten Version vergleichen
        id: vergleich
        working-directory: w
        run: |
          set +e
          python3 ../karte/vergleich.py "$( [ -f alt-index.json ] && echo alt-index.json || echo - )" zellen/index.json bericht.md
          rc=$?; cat bericht.md >> $GITHUB_STEP_SUMMARY
          VOR=$(python3 -c "import json;print(json.load(open('alt-aktuell.json')).get('version',''))")
          python3 ../karte/inventar.py vergleich "$( [ -s alt-inventar.tsv.gz ] && echo alt-inventar.tsv.gz || echo - )" inventar.tsv.gz \
            aenderungen.md aenderungen.json --version "$V" --vorher "$VOR"
          rc2=$?
          if { [ $rc -eq 3 ] || [ $rc2 -eq 3 ]; } && [ "${{ inputs.trotzdem }}" != "true" ]; then echo "auffaellig=1" >> $GITHUB_OUTPUT; fi
          if [ $rc -ne 0 ] && [ $rc -ne 3 ]; then exit $rc; fi
          if [ $rc2 -ne 0 ] && [ $rc2 -ne 3 ]; then exit $rc2; fi
          gzip -kf aenderungen.json

      - name: Grundkarte erzeugen (Planetiler, OpenMapTiles wie OpenFreeMap)
        working-directory: w
        run: |
          curl -sSfL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v$PLANETILER/planetiler.jar
          java -Xmx10g -jar planetiler.jar --osm-path=gebiet.pbf --output=grundkarte.pmtiles --download --force --maxzoom=14 2>&1 | grep -E "WAR|ERR|archive\s|Finished|features" | tail -20
          ls -la grundkarte.pmtiles
          rm -rf data/tmp

      - name: Hochladen (neue Version, alte bleibt)
        working-directory: w
        run: |
          rclone copy zellen "r2:$BUCKET/karte/$V/zellen" --transfers 32 --checkers 32 --s3-no-check-bucket --stats 60s --stats-one-line
          rclone copyto grundkarte.pmtiles "r2:$BUCKET/karte/$V/grundkarte.pmtiles" --s3-chunk-size 64M --s3-upload-concurrency 8
          rclone copyto wege.pmtiles "r2:$BUCKET/karte/$V/wege.pmtiles" --s3-chunk-size 64M --s3-upload-concurrency 8
          rclone copyto bericht.md "r2:$BUCKET/karte/$V/bericht.md"
          rclone copyto abdeckung.json "r2:$BUCKET/karte/$V/abdeckung.json"
          rclone copyto inventar.tsv.gz "r2:$BUCKET/karte/$V/inventar.tsv.gz"
          rclone copyto aenderungen.json.gz "r2:$BUCKET/karte/$V/aenderungen.json.gz"

      - name: Höhenmodell, Hangneigung, Höhenlinien
        if: env.HOEHEN_RECHNEN == '1' && steps.vergleich.outputs.auffaellig != '1'
        working-directory: w
        run: |
          rm -rf gebiet.pbf at.pbf st.pbf zellen
          python3 ../karte/hoehen.py liste at.geojson suedtirol.geojson --zoom 0-15
          python3 ../karte/hoehen.py dem dem at.geojson suedtirol.geojson --zoom 0-13 --threads 32
          python3 ../karte/hoehen.py dem dem14 at.geojson suedtirol.geojson --zoom 14-14 --threads 32
          python3 ../karte/hoehen.py hang dem hang --zoom 11-13
          python3 ../karte/hoehen.py hang dem14 hang --zoom 14-14
          rm -rf dem14
          rclone copy hang "r2:$BUCKET/hang" --transfers 32 --checkers 32 --stats 120s --stats-one-line
          python3 - <<'EOF'
          import sys; sys.path.insert(0, "../karte")
          from hoehen import gebiet, kacheln
          g = gebiet(["at.geojson", "suedtirol.geojson"])
          open("hl-liste.txt", "w").write("\n".join(f"{z}/{x}/{y}" for z, x, y in kacheln(g, 12, 14)))  # Zoom 15 rechnet die App selbst
          EOF
          wc -l hl-liste.txt
          (cd ../karte && npm i --no-save --silent maplibre-contour@0.1.1 pngjs@7)
          for i in 0 1 2 3; do node ../karte/hoehenlinien.mjs dem hl-liste.txt hl $i/4 & done; wait
          python3 ../karte/packen.py hl hoehenlinien.pmtiles mvt
          rclone copyto hoehenlinien.pmtiles "r2:$BUCKET/karte/hoehenlinien-$V.pmtiles" --s3-chunk-size 64M
          echo "HOEHEN=--hang hang/ --hoehenlinien karte/hoehenlinien-$V.pmtiles" >> $GITHUB_ENV

      - name: Freischalten
        if: steps.vergleich.outputs.auffaellig != '1'
        working-directory: w
        run: |
          python3 ../karte/freischalten.py --alt alt-aktuell.json --neu aktuell.json --version "$V" --zellen-index zellen-index.json \
            --abdeckung abdeckung.json --grundkarte grundkarte.pmtiles --gebiete "$GEBIETE" --wege "karte/$V/wege.pmtiles" $HOEHEN
          rclone copyto aktuell.json "r2:$BUCKET/karte/aktuell.json"

      - name: Test über den Worker (sonst alte Version zurück)
        if: steps.vergleich.outputs.auffaellig != '1'
        working-directory: w
        run: |
          sleep 330   # Worker merkt sich aktuell.json bis zu 5 Minuten
          ok=1
          curl -sf "$WORKER/karte/status" | tee status.json | grep -q "\"version\":\"$V\"" || ok=0
          # Kachel Innsbruck z14 und Zelle Brandnertal (Wege)
          curl -sf -o t.pbf -w "%{http_code} %header{x-quelle}\n" "$WORKER/karte/tiles/14/8710/5744.pbf?v=$V" | grep -q "200 eigen" || ok=0
          # Hütten-Zelle Walsertal/Brandnertal (Wege kommen seit v1917 als Vektorkacheln, die sac-Zellen enthalten nur noch Klettersteige)
          curl -sf "$WORKER/karte/zellen/hut/24_118.json" | python3 -c "import json,sys;j=json.load(sys.stdin);n=[e.get('tags',{}).get('name','') for e in j['elements']];print('Hütten-Zelle 24_118:',len(n),'Einträge, Gaßneralpe','ja' if 'Gaßneralpe' in n else 'nein');assert len(n)>50" || ok=0
          # Wege-Vektorkachel Brandnertal z14
          curl -sf -o w.pbf -w "%{http_code}\n" "$WORKER/karte/wege/14/8635/5753.pbf" | grep -q "200" || ok=0
          if [ $ok -ne 1 ]; then
            echo "::error::Test fehlgeschlagen – alte Version wird wieder eingesetzt"
            if [ -s alt-aktuell.json ] && [ "$(cat alt-aktuell.json)" != "{}" ]; then rclone copyto alt-aktuell.json "r2:$BUCKET/karte/aktuell.json"; fi
            exit 1
          fi
          echo "Freigeschaltet: Version $V" >> $GITHUB_STEP_SUMMARY

      - name: Hütten-Öffnungszeiten für die neue Version einspielen
        if: steps.vergleich.outputs.auffaellig != '1'
        continue-on-error: true
        run: bash karte/huetten-einspielen.sh

      - name: Neue Hütten, Parkplätze, Bergbahnen, Klettersteige in die Datenbank
        if: steps.vergleich.outputs.auffaellig != '1'
        continue-on-error: true
        working-directory: w
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 ../karte/inventar.py db aenderungen.json aenderungen.md
          if [ -n "$SUPABASE_SERVICE_KEY" ]; then
            python3 ../karte/parkplaetze.py db-neu park-neu.json "Vorarlberg,Tirol,Salzburg,Kärnten,Südtirol,Steiermark,Oberösterreich,Niederösterreich,Wien,Burgenland" \
              | sed 's/^/- Parkplätze: /' >> aenderungen.md
          fi

      - name: Bericht ins Repo (daten/karte/<Version>.md)
        if: always() && env.V != ''
        run: |
          mkdir -p daten/karte
          { cat w/aenderungen.md 2>/dev/null || echo "# Wanderkarte $V"; echo; echo "## Zellen-Vergleich (Anzahl je Ebene)"; tail -n +2 w/bericht.md 2>/dev/null;
            echo; if [ "${{ steps.vergleich.outputs.auffaellig }}" = "1" ]; then echo "**Status: NICHT freigeschaltet (auffällig).** Neue Daten liegen unter karte/$V/."; \
            elif [ "${{ job.status }}" = "success" ]; then echo "**Status: freigeschaltet.**"; else echo "**Status: Lauf mit Fehler abgebrochen – alte Version bleibt.**"; fi; } > "daten/karte/$V.md"
          git config user.name "gipfelbuch-karte"; git config user.email "karte@users.noreply.github.com"
          git add daten/karte
          git diff --cached --quiet || { git commit -m "Karte: Änderungsbericht $V"; for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 15; done; }

      - name: Auffällig – nicht freigeschaltet
        if: steps.vergleich.outputs.auffaellig == '1'
        run: |
          echo "::error::Vergleich auffällig (über 2 % weniger Wege in einer Region). Neue Daten liegen unter karte/$V/, sind aber NICHT freigeschaltet. Bericht siehe Zusammenfassung."
          exit 1

  pruefen:
    needs: karte
    uses: ./.github/workflows/karte-pruefen.yml
    secrets: inherit
