# Gipfelbuch – eigene Wanderkarte erzeugen und auf den eigenen Kartenserver (Cloudflare R2) laden.
# Läuft automatisch 4 x pro Jahr (3. März, Juni, September, Dezember) und kann jederzeit von Hand gestartet werden
# (GitHub → Actions → „Karte aktualisieren“ → Run workflow). Braucht keine Claude-Nutzung.
#
# Einmalig nötig (macht Marcel, Claude gibt keine Schlüssel ein):
#   Cloudflare → R2 → „API-Token verwalten“ → Token mit „Objekt Lesen & Schreiben“ nur für den Speicher qfeaktivfotos anlegen.
#   GitHub → Projekt gipfelbuch → Settings → Secrets and variables → Actions → zwei Secrets anlegen:
#     R2_ACCESS_KEY_ID  und  R2_SECRET_ACCESS_KEY  (Werte aus dem Cloudflare-Token)
#
# Ablauf: OSM-Daten Österreich + Südtirol holen → Grundkarte (PMTiles) + Wege-Zellen erzeugen → mit der letzten Version vergleichen
# (verschwinden in einer Region über 2 % der Wege: NICHT freischalten) → hochladen → freischalten (karte/aktuell.json)
# → kurzer Test über den Worker; schlägt er fehl, wird die alte Version wieder eingesetzt. Alte Versionen bleiben im Speicher.
name: Karte aktualisieren

on:
  schedule:
    - cron: "17 2 3 3,6,9,12 *"
  workflow_dispatch:
    inputs:
      hoehen:
        description: "Höhenmodell, Hangneigung und Höhenlinien (neu) berechnen (beim ersten Mal ja)"
        type: boolean
        default: false
      trotzdem:
        description: "Auch freischalten, wenn der Vergleich auffällig ist (nur nach Prüfung!)"
        type: boolean
        default: false

concurrency: karte

permissions:
  contents: read

env:
  GEBIETE: "Österreich,Südtirol"
  BUCKET: qfeaktivfotos
  WORKER: https://gipfelbuch.quer-feld-ein.workers.dev
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ENDPOINT: https://fbcade196ec6ad17a597c7ae5d75b31b.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
  PLANETILER: "0.9.1"

jobs:
  karte:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Zugang prüfen
        run: |
          if [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ] || [ -z "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::Secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY fehlen (siehe Kopf dieser Datei)."; exit 1; fi

      - name: Platz schaffen und Werkzeuge installieren
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool rclone > /dev/null
          pip install -q osmium shapely pmtiles numpy pillow
          df -h . | tail -1

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Version festlegen
        run: |
          echo "V=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV
          mkdir -p w && cd w
          rclone copyto r2:$BUCKET/karte/aktuell.json alt-aktuell.json 2>/dev/null || echo '{}' > alt-aktuell.json
          python3 -c "import json;a=json.load(open('alt-aktuell.json'));print(a.get('basis',''))" > alt-basis.txt
          if [ -s alt-basis.txt ] && [ "$(cat alt-basis.txt)" != "" ]; then rclone copyto "r2:$BUCKET/$(cat alt-basis.txt)zellen/index.json" alt-index.json || true; fi
          # Höhendaten beim ersten Lauf oder auf Wunsch berechnen
          if [ "${{ inputs.hoehen }}" = "true" ] || ! grep -q '"hang"' alt-aktuell.json; then echo "HOEHEN_RECHNEN=1" >> $GITHUB_ENV; fi

      - name: OSM-Daten holen (Österreich, Nordost-Italien) und Südtirol ausschneiden
        working-directory: w
        run: |
          curl -sSfL -o at.pbf  https://download.geofabrik.de/europe/austria-latest.osm.pbf
          curl -sSfL -o at.poly https://download.geofabrik.de/europe/austria.poly
          curl -sSfL -o ne.pbf  https://download.geofabrik.de/europe/italy/nord-est-latest.osm.pbf
          osmium tags-filter ne.pbf r/boundary=administrative -o adm.pbf --overwrite
          python3 ../karte/gebiet.py admin adm.pbf "^(Südtirol|Alto Adige|Provincia autonoma di Bolzano)" 6 suedtirol.geojson
          python3 ../karte/gebiet.py poly at.poly at.geojson
          osmium extract -p suedtirol.geojson ne.pbf -o st.pbf --overwrite
          osmium merge at.pbf st.pbf -o gebiet.pbf --overwrite
          rm -f ne.pbf adm.pbf
          python3 ../karte/gebiet.py abdeckung abdeckung.json at.geojson suedtirol.geojson
          ls -la

      - name: Wege-Zellen erzeugen (Hütten, Wege, Parkplätze, Sperren …)
        working-directory: w
        run: |
          python3 ../karte/zellen.py gebiet.pbf zellen --version "$V"
          cp zellen/index.json zellen-index.json

      - name: Mit der letzten Version vergleichen
        id: vergleich
        working-directory: w
        run: |
          set +e
          python3 ../karte/vergleich.py "$( [ -f alt-index.json ] && echo alt-index.json || echo - )" zellen/index.json bericht.md
          rc=$?; cat bericht.md >> $GITHUB_STEP_SUMMARY
          if [ $rc -eq 3 ] && [ "${{ inputs.trotzdem }}" != "true" ]; then echo "auffaellig=1" >> $GITHUB_OUTPUT; fi
          if [ $rc -ne 0 ] && [ $rc -ne 3 ]; then exit $rc; fi

      - name: Grundkarte erzeugen (Planetiler, OpenMapTiles wie OpenFreeMap)
        working-directory: w
        run: |
          curl -sSfL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v$PLANETILER/planetiler.jar
          java -Xmx10g -jar planetiler.jar --osm-path=gebiet.pbf --output=grundkarte.pmtiles --download --force --maxzoom=14 2>&1 | grep -E "WAR|ERR|archive\s|Finished|features" | tail -20
          ls -la grundkarte.pmtiles
          rm -rf data/tmp

      - name: Hochladen (neue Version, alte bleibt)
        working-directory: w
        run: |
          rclone copy zellen "r2:$BUCKET/karte/$V/zellen" --transfers 32 --checkers 32 --s3-no-check-bucket --stats 60s --stats-one-line
          rclone copyto grundkarte.pmtiles "r2:$BUCKET/karte/$V/grundkarte.pmtiles" --s3-chunk-size 64M --s3-upload-concurrency 8
          rclone copyto bericht.md "r2:$BUCKET/karte/$V/bericht.md"
          rclone copyto abdeckung.json "r2:$BUCKET/karte/$V/abdeckung.json"

      - name: Höhenmodell, Hangneigung, Höhenlinien
        if: env.HOEHEN_RECHNEN == '1' && steps.vergleich.outputs.auffaellig != '1'
        working-directory: w
        run: |
          rm -rf gebiet.pbf at.pbf st.pbf zellen
          python3 ../karte/hoehen.py liste at.geojson suedtirol.geojson --zoom 0-15
          python3 ../karte/hoehen.py dem dem at.geojson suedtirol.geojson --zoom 0-13 --threads 32
          rclone copy dem "r2:$BUCKET/dem" --size-only --transfers 32 --checkers 32 --stats 120s --stats-one-line
          python3 ../karte/hoehen.py dem dem14 at.geojson suedtirol.geojson --zoom 14-14 --threads 32
          python3 ../karte/hoehen.py hang dem hang --zoom 11-13
          python3 ../karte/hoehen.py hang dem14 hang --zoom 14-14
          rm -rf dem14
          rclone copy hang "r2:$BUCKET/hang" --transfers 32 --checkers 32 --stats 120s --stats-one-line
          python3 - <<'EOF'
          import sys; sys.path.insert(0, "../karte")
          from hoehen import gebiet, kacheln
          g = gebiet(["at.geojson", "suedtirol.geojson"])
          open("hl-liste.txt", "w").write("\n".join(f"{z}/{x}/{y}" for z, x, y in kacheln(g, 12, 15)))
          EOF
          wc -l hl-liste.txt
          (cd ../karte && npm i --no-save --silent maplibre-contour@0.1.1 pngjs@7)
          for i in 0 1 2 3; do node ../karte/hoehenlinien.mjs dem hl-liste.txt hl $i/4 & done; wait
          python3 ../karte/packen.py hl hoehenlinien.pmtiles mvt
          rclone copyto hoehenlinien.pmtiles "r2:$BUCKET/karte/hoehenlinien-$V.pmtiles" --s3-chunk-size 64M
          echo "HOEHEN=--hang hang/ --hoehenlinien karte/hoehenlinien-$V.pmtiles" >> $GITHUB_ENV

      - name: Freischalten
        if: steps.vergleich.outputs.auffaellig != '1'
        working-directory: w
        run: |
          python3 ../karte/freischalten.py --alt alt-aktuell.json --neu aktuell.json --version "$V" --zellen-index zellen-index.json \
            --abdeckung abdeckung.json --grundkarte grundkarte.pmtiles --gebiete "$GEBIETE" $HOEHEN
          rclone copyto aktuell.json "r2:$BUCKET/karte/aktuell.json"

      - name: Test über den Worker (sonst alte Version zurück)
        if: steps.vergleich.outputs.auffaellig != '1'
        working-directory: w
        run: |
          sleep 330   # Worker merkt sich aktuell.json bis zu 5 Minuten
          ok=1
          curl -sf "$WORKER/karte/status" | tee status.json | grep -q "\"version\":\"$V\"" || ok=0
          # Kachel Innsbruck z14 und Zelle Brandnertal (Wege)
          curl -sf -o t.pbf -w "%{http_code} %header{x-quelle}\n" "$WORKER/karte/tiles/14/8710/5744.pbf?v=$V" | grep -q "200 eigen" || ok=0
          curl -sf "$WORKER/karte/zellen/sac/97_471.json" | python3 -c "import json,sys;j=json.load(sys.stdin);assert len(j['elements'])>100" || ok=0
          if [ $ok -ne 1 ]; then
            echo "::error::Test fehlgeschlagen – alte Version wird wieder eingesetzt"
            if [ -s alt-aktuell.json ] && [ "$(cat alt-aktuell.json)" != "{}" ]; then rclone copyto alt-aktuell.json "r2:$BUCKET/karte/aktuell.json"; fi
            exit 1
          fi
          echo "Freigeschaltet: Version $V" >> $GITHUB_STEP_SUMMARY

      - name: Auffällig – nicht freigeschaltet
        if: steps.vergleich.outputs.auffaellig == '1'
        run: |
          echo "::error::Vergleich auffällig (über 2 % weniger Wege in einer Region). Neue Daten liegen unter karte/$V/, sind aber NICHT freigeschaltet. Bericht siehe Zusammenfassung."
          exit 1
