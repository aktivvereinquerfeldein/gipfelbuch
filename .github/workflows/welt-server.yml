# qfe-active – ganze Welt auf gemieteten Servern (Hetzner Cloud) rechnen: Grundkarte, Wege, Kartenstücke, Kartenpaket Welt, feines Relief, Relief weit.
# Der Ablauf legt die Server an, startet karte/welt/welt.sh und ist dann fertig (die Server rechnen allein weiter).
# verteilt (Standard bei voll, wegen der Kontolimits): 1 Kartenserver (dedizierte Kerne + Zusatzplatte) und relief_server Reliefserver
# (geteilte Kerne) gleichzeitig. Jeder Server lädt seine Ergebnisse nach R2 und LÖSCHT SICH (und seine Zusatzplatte) DANN SELBST;
# ein Wachhund löscht spätestens nach max_stunden; der Ablauf „Welt Aufräumen“ entfernt übrig gebliebene Platten/Server.
# Fortschritt: R2 karte/welt/lauf/<Stand>-<Rolle>.log (alle 10 min) oder per SSH (Schlüssel karte/welt/claude_mac.pub).
# Routing (BRouter) gehört NICHT dazu. Die laufende Karte bleibt unverändert; die App nutzt die Weltdaten erst nach Bildvergleich.
# Braucht das Secret HCLOUD_TOKENNEU (oder HCLOUD_TOKEN): Hetzner Cloud → Projekt → Sicherheit → API-Token, Lesen & Schreiben.
name: Welt Server

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "probe = Liechtenstein + Andorra + Mont Blanc (Test der ganzen Kette), voll = ganze Welt"
        type: choice
        options: [probe, voll]
        default: probe
      verteilt:
        description: "ja = Kartenserver + Reliefserver gleichzeitig, nein = alles auf einem Server"
        type: choice
        options: [ja, nein]
        default: ja
      relief:
        description: "Feines Relief (Laserdaten, wie Vorarlberg) und Relief weit für die Welt mitrechnen"
        type: choice
        options: [ja, nein]
        default: ja
      relief_z16:
        description: "Feinste Reliefstufe Zoom 16: ueberall oder nur alpen (sonst bis Zoom 15)"
        type: choice
        options: [alpen, ueberall]
        default: alpen
      relief_server:
        description: "Anzahl Reliefserver (je 16 geteilte Kerne)"
        type: string
        default: "2"
      max_stunden:
        description: "Server werden spätestens nach so vielen Stunden gelöscht"
        type: string
        default: ""

concurrency: welt-server

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKENNEU || secrets.HCLOUD_TOKEN }}
      R2K: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2S: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: hcloud
        run: |
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::Secret HCLOUD_TOKEN fehlt"; exit 1; }
          T=$(printf '%s' "$HCLOUD_TOKEN" | tr -d '[:space:]'); echo "::add-mask::$T"; echo "HCLOUD_TOKEN=$T" >> $GITHUB_ENV
          curl -sSfL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar -xz hcloud && sudo mv hcloud /usr/local/bin/
          export HCLOUD_TOKEN="$T"
          hcloud server list -l qfe=welt   # laufende Welt-Server (z. B. ein Reliefserver) stören nicht: Namen enthalten den Stand
          hcloud server-type list -o columns=name,cores,cpu_type,architecture,memory,disk | grep -E "^(cc?x|cpx|cax)" | head -40 || true
      - name: Server anlegen und starten
        run: |
          M="${{ inputs.modus }}"; V="${{ inputs.verteilt }}"; N="${{ inputs.relief_server }}"; [ "${{ inputs.relief }}" = ja ] || N=0
          H="${{ inputs.max_stunden }}"; [ -n "$H" ] || { [ "$M" = voll ] && H=60 || H=4; }
          S=$(date -u +%Y-%m-%d-%H%M); echo "S=$S" >> $GITHUB_ENV
          ssh-keygen -t ed25519 -N "" -f lauf -q
          hcloud ssh-key create --name "welt-lauf-$S" --public-key-from-file lauf.pub --label qfe=welt-lauf > /dev/null
          hcloud ssh-key describe qfe-claude-mac > /dev/null 2>&1 || hcloud ssh-key create --name qfe-claude-mac --public-key-from-file karte/welt/claude_mac.pub > /dev/null
          git archive --format=tar.gz --prefix=gipfelbuch/ HEAD > repo.tgz
          O="-i lauf -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR"
          echo "### Welt-Server ($M, Stand $S)" >> $GITHUB_STEP_SUMMARY

          # anlegen NAME "TYP1 TYP2 …" AUFGABE RELIEF_SERVER VOLUME_GB
          anlegen() {
            name="qfe-welt-$S-$1"; typen="$2"; auf="$3"; rs="$4"; vol="$5"; ok=0
            for L in fsn1 nbg1 hel1; do for T in $typen; do
              VID=""
              if [ "$vol" -gt 0 ]; then
                hcloud volume create --name "$name" --size "$vol" --location "$L" --format ext4 --label qfe=welt -o json > vol.json 2> fehler.txt || { cat fehler.txt; continue; }
                VID=$(jq -r .volume.id vol.json)
              fi
              if hcloud server create --name "$name" --type "$T" --image ubuntu-24.04 --location "$L" --ssh-key "welt-lauf-$S" --ssh-key qfe-claude-mac \
                   --label qfe=welt ${VID:+--volume $VID --automount} -o json > server.json 2> fehler.txt; then ok=1; break 2; fi
              cat fehler.txt
              [ -n "$VID" ] && hcloud volume delete "$VID" > /dev/null || true
            done; done
            [ $ok = 1 ] || { echo "::error::Server $name konnte nicht angelegt werden"; return 1; }
            IP=$(jq -r .server.public_net.ipv4.ip server.json); ID=$(jq -r .server.id server.json)
            echo "Server $name: Typ $T in $L, IP $IP, ID $ID, Platte ${VID:-keine}"
            echo "- $auf ${rs}: Typ $T in $L, IP \`$IP\`, Zusatzplatte ${vol} GB" >> $GITHUB_STEP_SUMMARY
            for i in $(seq 1 60); do ssh $O root@$IP true 2>/dev/null && break; sleep 5; done
            scp $O repo.tgz root@$IP:/root/ && ssh $O root@$IP "tar -xzf /root/repo.tgz -C /root && rm /root/repo.tgz"
            PT=""   # Planetiler-Zwischendaten auf die Zusatzplatte (lokale Platte zu klein für die Welt, Lauf 26.11.)
            printf 'MODUS=%s\nS=%s\nAUFGABE=%s\nRELIEF_SERVER=%s\nSERVER_ID=%s\nVOLUME_ID=%s\nPT_TMP=%s\nRELIEF=%s\nRELIEF_Z16=%s\nHCLOUD_TOKEN=%s\nRCLONE_CONFIG_R2_ACCESS_KEY_ID=%s\nRCLONE_CONFIG_R2_SECRET_ACCESS_KEY=%s\n' \
              "$M" "$S" "$auf" "$rs" "$ID" "$VID" "$PT" "${{ inputs.relief }}" "${{ inputs.relief_z16 }}" "$HCLOUD_TOKEN" "$R2K" "$R2S" | ssh $O root@$IP "umask 077; cat > /root/welt.env"
            scp $O karte/welt/loeschen.sh root@$IP:/root/loeschen.sh
            ssh $O root@$IP "chmod 700 /root/loeschen.sh && systemd-run --unit=welt-wachhund --on-active=${H}h /root/loeschen.sh && \
              systemd-run --unit=welt bash -c 'bash /root/gipfelbuch/karte/welt/welt.sh > /root/welt.log 2>&1'"
          }

          if [ "$V" = nein ]; then
            if [ "$M" = voll ]; then anlegen alles "ccx63 ccx53" alles 0/1 0; else anlegen alles "ccx23" alles 0/1 0; fi
          else
            # Kartenserver: dedizierte Kerne (Limit 22) + Zusatzplatte; Reliefserver: geteilte Kerne (Limit 33)
            if [ "$M" = voll ]; then anlegen karte "ccx43 ccx33" karte 0/1 1500; RT="cpx62 cx53 cpx52 cax41"
            else anlegen karte "ccx13 ccx23" karte 0/1 20; RT="cx33 cpx32 cx32 cax21"; fi
            for i in $(seq 0 $((N - 1))); do anlegen relief-$i "$RT" relief $i/$N 0; done
          fi
          hcloud ssh-key delete "welt-lauf-$S" > /dev/null || true
          hcloud server list -l qfe=welt; hcloud volume list -l qfe=welt
          echo "- Wachhund: spätestens nach $H Stunden gelöscht" >> $GITHUB_STEP_SUMMARY
      - name: Schlüssel aufräumen
        if: always()
        run: hcloud ssh-key list -l qfe=welt-lauf -o noheader -o columns=id | xargs -r -n1 hcloud ssh-key delete || true
