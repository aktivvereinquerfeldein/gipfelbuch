# Hilfe für Claude: zeigt, welche Seiten der Parkplatz-Sammler auf einzelnen Webseiten findet (nur lesen).
name: Parkplätze Probe
on:
  workflow_dispatch:
    inputs:
      urls: {description: "Adressen, mit Leerzeichen getrennt", type: string, required: true}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils > /dev/null
      - run: python3 karte/parkplaetze.py probe ${{ inputs.urls }}
