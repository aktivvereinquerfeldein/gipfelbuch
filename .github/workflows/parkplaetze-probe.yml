# Hilfe für Claude: zeigt, welche Seiten der Parkplatz-Sammler auf einzelnen Webseiten findet (nur lesen).
name: Parkplätze Probe
on:
  workflow_dispatch:
    inputs:
      urls: {description: "Adressen, mit Leerzeichen getrennt", type: string, required: true}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils > /dev/null
      - run: |
          mkdir -p daten/park && python3 karte/parkplaetze.py probe ${{ inputs.urls }} > daten/park/probe.txt 2>&1 || true
          git config user.name "gipfelbuch-sammler"; git config user.email "sammler@users.noreply.github.com"
          git add daten/park/probe.txt && git commit -q -m "Parkplätze: Probe" && git pull --rebase -q && git push -q || true
