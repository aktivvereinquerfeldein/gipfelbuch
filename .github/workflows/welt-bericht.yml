# qfe-active – Stand eines Welt-Server-Laufs aus R2 anzeigen (Schritte, Protokollende, Berichte), auch wenn die Server schon gelöscht sind.
name: Welt Bericht

on:
  workflow_dispatch:
    inputs:
      stand:
        description: "Stand, z. B. 2026-11-26-2040 (leer = neuester)"
        type: string
        default: ""

jobs:
  bericht:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: https://fbcade196ec6ad17a597c7ae5d75b31b.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    steps:
      - name: Bericht
        run: |
          curl -fsSL -o r.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip && unzip -q r.zip && sudo install rclone-*/rclone /usr/local/bin/
          B=qfeaktivfotos; S="${{ inputs.stand }}"
          [ -n "$S" ] || S=$(rclone lsf r2:$B/karte/welt/lauf/ | grep schritte | sort | tail -1 | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}')
          echo "Stand $S"
          for f in $(rclone lsf r2:$B/karte/welt/lauf/ | grep "^$S"); do echo "===== $f"; rclone cat r2:$B/karte/welt/lauf/$f | tail -40; done
          for d in "$S" "$S-probe"; do
            rclone lsl r2:$B/karte/welt/$d/ 2>/dev/null | head -60
            for f in $(rclone lsf -R r2:$B/karte/welt/$d/ 2>/dev/null | grep -E "bericht.*\.md$"); do echo "===== $f"; rclone cat r2:$B/karte/welt/$d/$f; done
          done
