# Reliefbilder aus dem 1-m-Laserscan-Modell des BEV (v1997) – fein wie bergfex. Nur Österreich (BEV), Grenzstreifen
# mit AWS aufgefüllt. Ergebnis: R2 karte/relief1m/<Stand>.pmtiles + karte/relief1m/aktuell.json {pfad, stand, bloecke}.
# Der Worker liefert /karte/relief1m/z/x/y.webp und lässt im selben Gebiet die gröberen Bilder (/karte/relief) weg.
name: Relief 1m

on:
  workflow_dispatch:
    inputs:
      gebiet:
        description: "Rechtecke w,s,e,n;… (Standard Vorarlberg)"
        default: "9.53,46.84,10.24,47.6"
      parallel:
        description: "Blöcke gleichzeitig"
        default: "3"
      nur_aufraeumen:
        description: "ja = nichts rechnen, nur alte Stände löschen"
        default: "nein"

permissions:
  contents: read

env:
  BUCKET: qfeaktivfotos
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ENDPOINT: https://fbcade196ec6ad17a597c7ae5d75b31b.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"

concurrency:
  group: relief1m
  cancel-in-progress: false

jobs:
  relief:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          # v2030: rclone direkt vom Hersteller (Ubuntu-Paketquelle von GitHub war zeitweise nicht erreichbar), sonst wie bisher über apt
          if curl -fsSL --retry 3 -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip && unzip -q -o /tmp/rclone.zip -d /tmp/rclone; then
            sudo install -m 755 /tmp/rclone/rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq rclone > /dev/null
          fi
          rclone version | head -1
          pip install -q numpy pillow pmtiles rasterio
      - name: Reliefbilder rechnen
        if: github.event.inputs.nur_aufraeumen != 'ja'
        run: python3 karte/relief1m.py /tmp/relief "${{ github.event.inputs.gebiet || '9.53,46.84,10.24,47.6' }}" "${{ github.event.inputs.parallel || '3' }}"
      - name: Packen und hochladen
        if: github.event.inputs.nur_aufraeumen != 'ja'
        run: |
          python3 karte/relief.py --pmtiles /tmp/relief /tmp/relief1m.pmtiles
          ls -la /tmp/relief1m.pmtiles
          STAND=$(date +%F-%H%M)
          for i in 1 2 3; do rclone copyto /tmp/relief1m.pmtiles "r2:$BUCKET/karte/relief1m/$STAND.pmtiles" --s3-chunk-size 64M --s3-upload-concurrency 8 && break; sleep 5; done
          python3 -c "import json;print(json.dumps({'pfad':'karte/relief1m/$STAND.pmtiles','stand':'$STAND','bloecke':json.load(open('/tmp/relief/bloecke.json'))}))" > aktuell.json
          for i in 1 2 3; do rclone copyto aktuell.json "r2:$BUCKET/karte/relief1m/aktuell.json" && break; sleep 5; done
          head -c 300 aktuell.json
          echo "## Relief 1m $STAND" >> $GITHUB_STEP_SUMMARY; ls -la /tmp/relief1m.pmtiles >> $GITHUB_STEP_SUMMARY
      # v2034: alte Stände löschen (Marcel 11.11.2026) – nur *.pmtiles in karte/relief1m/, nie der Stand aus aktuell.json
      - name: Alte Stände löschen
        run: |
          AKT=$(rclone cat "r2:$BUCKET/karte/relief1m/aktuell.json" | python3 -c "import json,sys;print(json.load(sys.stdin)['pfad'].split('/')[-1])")
          case "$AKT" in *.pmtiles) ;; *) echo "kein gültiger Stand – nichts gelöscht"; exit 0;; esac
          rclone lsf "r2:$BUCKET/karte/relief1m/$AKT" | grep -q . || { echo "aktueller Stand fehlt – nichts gelöscht"; exit 0; }
          echo "## Aufräumen (behalten: $AKT)" >> $GITHUB_STEP_SUMMARY
          rclone ls "r2:$BUCKET/karte/relief1m/" --filter "- $AKT" --filter "+ *.pmtiles" --filter "- *" | tee -a $GITHUB_STEP_SUMMARY
          rclone delete "r2:$BUCKET/karte/relief1m/" --filter "- $AKT" --filter "+ *.pmtiles" --filter "- *"
          rclone ls "r2:$BUCKET/karte/relief1m/" | tee -a $GITHUB_STEP_SUMMARY
